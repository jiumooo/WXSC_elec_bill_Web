name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只发布站点本体，避免把 .git 之类的东西塞进 Pages 产物
      # relay/ 只放 worker.js + endpoints.json，data/ 是离线历史台账
      - name: Stage site
        run: |
          mkdir -p _site/relay
          cp -R index.html assets README.md LICENSE .nojekyll _site/
          cp relay/worker.js relay/endpoints.json _site/relay/
          cp -R data _site/data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
