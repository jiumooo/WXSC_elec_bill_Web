name: Refresh history data

# 每天用真实接口刷新 data/，刷新完顺手部署一次 Pages。
# 注意：用 GITHUB_TOKEN 推的提交不会触发其它 workflow（GitHub 防递归），
# 所以部署要写在本 workflow 里，不能指望 pages.yml 被自动触发。
on:
  schedule:
    - cron: '17 19 * * *'   # UTC 19:17 = 北京时间 03:17
  workflow_dispatch:
    inputs:
      loudong:
        description: '只抓某个楼栋（留空 = 全部）'
        required: false
        default: ''
      limit:
        description: '每个楼栋最多抓几间（留空 = 全部）'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl
        env:
          LOUDONG: ${{ inputs.loudong }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS="--concurrency 6"
          if [ -n "$LOUDONG" ]; then ARGS="$ARGS --loudong $LOUDONG"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          node tools/crawl.mjs $ARGS

      - name: Normalize
        run: node tools/normalize-data.mjs

      - name: Build combined index
        run: node tools/build-index.mjs

      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "数据没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): refresh $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage site
        run: |
          mkdir -p _site/relay
          cp -R index.html assets README.md LICENSE .nojekyll _site/
          cp relay/worker.js relay/endpoints.json relay/deno.ts relay/server.mjs _site/relay/
          cp -R data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
